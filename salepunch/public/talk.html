<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Call</title>
  <meta name="theme-color" content="#0b0d18">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(500px 360px at 50% 0%, rgba(255,90,31,.18), transparent 70%), #0b0d18; color: #f3f4fb; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 400px; text-align: center; }
    .av { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #ff8a4c, #e0300a); position: relative; }
    .av.ring::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid rgba(255,122,61,.6); animation: ping 1.6s infinite; }
    .av.live { background: linear-gradient(135deg, #36d27f, #0f9a52); }
    @keyframes ping { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
    h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
    .muted { color: #9aa0bd; font-size: 15px; margin: 0; }
    .timer { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; margin-top: 10px; color: #7fe0a8; min-height: 27px; }
    .btns { display: flex; gap: 14px; justify-content: center; margin-top: 30px; }
    button { font: inherit; font-weight: 700; border: 0; cursor: pointer; border-radius: 999px; color: #fff; }
    .join { width: 100%; padding: 18px; font-size: 18px; background: linear-gradient(135deg, #1fc16b, #0f9a52); box-shadow: 0 14px 30px -12px rgba(18,161,80,.9); }
    .round { width: 66px; height: 66px; display: grid; place-items: center; font-size: 13px; }
    .end { background: #e0352b; } .mute { background: #23273f; } .mute.on { background: #f2b24a; color: #1a1300; }
    .note { margin-top: 22px; font-size: 13px; color: #8a8fab; }
    .err { margin-top: 18px; background: rgba(224,53,43,.15); color: #ff8a80; padding: 12px; border-radius: 12px; font-size: 14px; display: none; }
    svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <main class="card">
    <div class="av ring" id="av">…</div>
    <h1 id="who">Connecting…</h1>
    <p class="muted" id="sub">&nbsp;</p>
    <div class="timer" id="timer"></div>
    <div id="pre" style="margin-top:28px;display:none">
      <button class="join" id="join">📞&nbsp; Join call</button>
      <p class="note">Free internet call · uses your mobile data or Wi-Fi.<br>This call is recorded for quality and training.</p>
    </div>
    <div class="btns" id="incall" style="display:none">
      <button class="round mute" id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
      <button class="round end" id="end" aria-label="End call"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    </div>
    <div class="err" id="err"></div>
    <audio id="remote" autoplay playsinline></audio>
  </main>
<script>
  const token = location.pathname.split('/').pop();
  const $ = (id) => document.getElementById(id);
  const api = async (path, opts = {}) => {
    const r = await fetch(`/api/talk/${token}${path}`, { method: opts.body ? 'POST' : (opts.method || 'GET'), headers: { 'content-type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Something went wrong');
    return d;
  };
  const showErr = (m) => { const e = $('err'); e.textContent = m; e.style.display = 'block'; };
  let pc, mic, t0, timer, info;
  const ended = (msg) => {
    clearInterval(timer);
    if (pc) { try { pc.close(); } catch { } }
    if (mic) mic.getTracks().forEach((t) => t.stop());
    $('av').className = 'av'; $('incall').style.display = 'none'; $('pre').style.display = 'none';
    $('sub').textContent = msg || 'Call ended. Thank you!';
  };
  async function load() {
    try { info = await api(''); } catch { return ended('This call link is not valid.'); }
    if (info.ended) return ended('This call has ended. Thank you!');
    $('av').textContent = (info.agent || info.company || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    $('who').textContent = info.agent ? `${info.agent} is calling you` : 'You have a call';
    $('sub').textContent = info.company ? `from ${info.company}` : '';
    document.title = info.company ? `Call from ${info.company}` : 'Call';
    $('pre').style.display = 'block';
  }
  async function waitOffer() {
    for (let i = 0; i < 40; i++) {
      const d = await api('');
      if (d.ended) throw new Error('The call was ended.');
      if (d.offer) return d.offer;
      await new Promise((r) => setTimeout(r, 1500));
    }
    throw new Error('The caller is not ready. Please try again.');
  }
  $('join').onclick = async () => {
    $('join').disabled = true; $('join').textContent = 'Connecting…';
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      const [{ ice }, offer] = await Promise.all([api('/ice'), waitOffer()]);
      pc = new RTCPeerConnection({ iceServers: ice });
      mic.getTracks().forEach((t) => pc.addTrack(t, mic));
      pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; $('remote').play().catch(() => {}); };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          $('av').className = 'av live'; $('sub').textContent = info.company ? `On call with ${info.company}` : 'On call';
          t0 = Date.now(); clearInterval(timer);
          timer = setInterval(() => { const s = Math.round((Date.now() - t0) / 1000); $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 1000);
        }
        if (['failed', 'closed'].includes(pc.connectionState)) { api('/leave', { body: {} }).catch(() => {}); ended(pc.connectionState === 'failed' ? 'The connection dropped. Please open the link again.' : ''); }
      };
      await pc.setRemoteDescription({ type: 'offer', sdp: offer });
      await pc.setLocalDescription(await pc.createAnswer());
      await new Promise((res) => { if (pc.iceGatheringState === 'complete') return res(); pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && res()); setTimeout(res, 4000); });
      await api('/answer', { body: { sdp: pc.localDescription.sdp } });
      $('pre').style.display = 'none'; $('incall').style.display = 'flex'; $('sub').textContent = 'Connecting…';
      // The caller ending the call ends it here too.
      (async function watch() { while (pc && pc.connectionState !== 'closed') { await new Promise((r) => setTimeout(r, 3000)); try { const d = await api(''); if (d.ended) return ended(); } catch { } } })();
    } catch (e) {
      $('join').disabled = false; $('join').textContent = '📞  Join call';
      showErr(e.name === 'NotAllowedError' ? 'Please allow the microphone so you can talk.' : e.message);
    }
  };
  $('mute').onclick = () => { const on = !$('mute').classList.contains('on'); $('mute').classList.toggle('on', on); mic.getAudioTracks().forEach((t) => { t.enabled = !on; }); };
  $('end').onclick = () => { api('/leave', { body: {} }).catch(() => {}); ended(); };
  window.addEventListener('pagehide', () => { if (pc && pc.connectionState === 'connected') navigator.sendBeacon(`/api/talk/${token}/leave`, new Blob(['{}'], { type: 'application/json' })); });
  load();
</script>
</body>
</html>
