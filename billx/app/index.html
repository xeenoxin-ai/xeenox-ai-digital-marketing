<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Billing and invoicing for hospitals, clinics, shops, restaurants, hotels, agencies and more: GST invoices, quotes, receipts, 10 designs, UPI QR and a client portal." />
    <link rel="icon" href="../logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BillX" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>BillX</title>
  </head>
  <body>
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/"><img src="../logo.svg" alt="" width="30" height="30" /><span>Bill<b>X</b></span></a>
      <button class="ws-btn" id="wsBtn" type="button" aria-label="Switch business"><span class="ws-name" id="wsName"></span><small id="wsSector"></small><i data-ic="down"></i></button>
      <nav class="nav">
        <a href="#/pos" class="nav-pos"><i data-ic="zap"></i><span>Quick Bill</span><kbd>Fast</kbd></a>
        <a href="#/"><i data-ic="dashboard"></i><span>Dashboard</span></a>
        <a href="#/docs/all"><i data-ic="file"></i><span>Documents</span></a>
        <a href="#/clients"><i data-ic="users"></i><span data-nav-clients>Clients</span></a>
        <a href="#/items"><i data-ic="box"></i><span>Items</span></a>
        <a href="#/reports"><i data-ic="chart"></i><span>Reports</span></a>
        <a href="#/design"><i data-ic="palette"></i><span>Design</span></a>
        <a href="#/settings"><i data-ic="settings"></i><span>Settings</span></a>
        <a href="#/subscription" id="navSub" hidden><i data-ic="star"></i><span>Subscription & team</span></a>
      </nav>
      <a class="btn primary block new-btn" href="#/new/invoice"><i data-ic="plus"></i> New invoice</a>
      <button type="button" class="btn block install-btn" id="installBtn" hidden><i data-ic="download"></i> Install BillX app</button>
      <p class="side-note" id="sideNote">Data stays in this browser. Back it up from Settings.</p>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"><i data-ic="menu"></i></button>
        <h1 id="pageTitle">BillX</h1>
        <div class="page-actions" id="pageActions"></div>
      </header>
      <div class="acct-banner" id="acctBanner" hidden></div>
      <main id="view" tabindex="-1"></main>
    </div>
    <script type="module" src="../src/app.js"></script>
  </body>
</html>
