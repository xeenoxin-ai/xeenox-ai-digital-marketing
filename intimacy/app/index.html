<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intimacy for Couples</title>
  <meta name="description" content="A private game for couples: truth or dare, desire match, position planner, date plans, and live video and voice for long-distance love. 18+.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0a10">
  <meta name="rating" content="adult">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="canonical" href="https://intimacycouple.com/play/">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-heat="2">
  <div id="ambience" aria-hidden="true"></div>
  <header class="top">
    <div class="brand"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.7A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8 3.1C20 16.1 12 21 12 21z"/></svg></span><b>intimacy</b><i id="net-dot" class="dot"></i></div>
    <div class="top-actions">
      <button id="heat-chip" class="chip" data-a="heat" title="Heat level"></button>
      <button class="icon-btn" data-a="hideApp" title="Hide app (Esc)" aria-label="Hide app">🙈</button>
    </div>
  </header>

  <main id="view"></main>

  <button id="pause-btn" class="pause-btn" data-a="pause" hidden title="Safe word — pause everything">🛑</button>

  <nav id="tabs" class="tabs" hidden>
    <button data-a="tab" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span></button>
    <button data-a="tab" data-tab="games"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="11" height="15" rx="2.5" transform="rotate(-8 9 12.5)"/><path d="M14 6.2l3.6.8a2.4 2.4 0 0 1 1.8 2.9l-2.4 10.4"/></svg><span>Play</span></button>
    <button data-a="tab" data-tab="positions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"/></svg><span>Positions</span></button>
    <button data-a="tab" data-tab="fantasy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Fantasy</span></button>
    <button data-a="tab" data-tab="us"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><circle cx="16.5" cy="9.5" r="2.6"/><path d="M3.5 19.5c.7-3.4 3-5.2 5.5-5.2s4.8 1.8 5.5 5.2"/><path d="M14.8 14.6c.6-.2 1.1-.3 1.7-.3 2.1 0 3.8 1.5 4.3 4.6"/></svg><span>Us</span><i class="badge" hidden></i></button>
  </nav>

  <!-- live call -->
  <div id="call" hidden>
    <video id="remote-video" autoplay playsinline></video>
    <div class="voice-face"><div class="avatar">💗</div></div>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-info"><b id="call-name"></b><span id="call-status"></span></div>
    <div class="call-bar">
      <button id="btn-mute" data-a="mute" title="Mute">🎙️</button>
      <button id="btn-cam" data-a="cam" title="Camera">📷</button>
      <button data-a="mini" title="Minimise">⤢</button>
      <button class="end" data-a="endCall" title="End call">✕</button>
    </div>
  </div>

  <div id="pause" class="overlay" hidden></div>
  <div id="modal" class="overlay" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- discreet mode: double-tap "Notes" to come back -->
  <div id="hide-screen" hidden>
    <h1 id="hide-title">Notes</h1>
    <ul><li>Milk, eggs, bread</li><li>Pay electricity bill</li><li>Call the plumber</li><li>Pick up dry cleaning</li><li>Gym — Tuesday 7 AM</li></ul>
  </div>

  <div id="lock" class="overlay" hidden>
    <form class="sheet center"><div class="logo-big">🔒</div><h2>Enter PIN</h2>
      <input type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="PIN">
      <button class="btn wide">Unlock</button></form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
