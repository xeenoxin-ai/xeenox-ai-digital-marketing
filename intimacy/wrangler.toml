# Intimacy for Couples — website + backend on Cloudflare Workers.
# The website is bundled into the Worker by site/build.mjs (worker/site.generated.js).
# Deploy: node site/build.mjs && npx wrangler@4.156.0 deploy   (see DEPLOY.md)
name = "intimacycouple"
main = "worker/index.js"
compatibility_date = "2025-10-01"
account_id = "775c1e02700fc336b170f305a68dd33e"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[d1_databases]]
binding = "DB"
database_name = "intimacycouple"
database_id = "3f6e8fa9-808b-43e4-aaf0-6674ce62ba01"

[observability]
enabled = true
preview_urls = false
