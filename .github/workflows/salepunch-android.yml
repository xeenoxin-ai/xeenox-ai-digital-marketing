name: Build SalePunch Android app

# Builds the SalePunch phone app (salepunch/android) into an installable APK.
# Download it from the run's "Artifacts" section and share it with agents.
on:
  push:
    paths:
      - 'salepunch/android/**'
      - '.github/workflows/salepunch-android.yml'
  pull_request:
    paths:
      - 'salepunch/android/**'
      - '.github/workflows/salepunch-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salepunch/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SalePunch-android-app
          path: salepunch/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Lets the SalePunch site host the APK at /download/salepunch.apk
      # (copied from this log when publishing a new app version).
      - name: Print APK for the download page
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha256sum "$f"
          echo "APK_BASE64_BEGIN"
          base64 -w 100 "$f"
          echo "APK_BASE64_END"
