name: Publish Intimacy for Couples to Cloudflare

# Builds the website (landing, SEO guides, /play app) and deploys it together with the
# backend (Worker + Durable Objects + D1) on every push to main that touches intimacy/.
# Needs the repository secret CLOUDFLARE_API_TOKEN with:
#   Account > Workers Scripts > Edit, Account > D1 > Edit (and Zone > Workers Routes > Edit
#   once a custom domain is added).
# Optional repository variable SITE_URL, e.g. https://intimacycouple.com (defaults to workers.dev).

on:
  push:
    branches:
      - main
    paths:
      - 'intimacy/**'
      - 'tests/intimacy.test.js'
      - '.github/workflows/intimacy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: intimacy-cloudflare
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test tests/intimacy.test.js

      - name: Build website
        run: node intimacy/site/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://intimacycouple.xeenox-in.workers.dev' }}

      - name: Apply database schema and deploy
        working-directory: intimacy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 775c1e02700fc336b170f305a68dd33e
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to publish Intimacy for Couples."
            exit 0
          fi
          npx -y wrangler@4.156.0 d1 execute intimacycouple --remote --file worker/schema.sql -y
          npx -y wrangler@4.156.0 deploy
